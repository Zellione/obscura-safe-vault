name: CI

on:
  # Run on PRs, and on pushes to main only (post-merge validation).
  # Feature-branch pushes are covered by the pull_request trigger, so this
  # avoids running the workflow twice for the same commit on an open PR.
  #
  # paths-ignore: skip the whole workflow when a push/PR touches *only* docs.
  # Any change that also touches a non-doc file (src/, tests/, scripts/,
  # premake5.lua, vendored submodules, this workflow, sonar config, …) still
  # runs the full matrix. This is a blocklist, not an allowlist, so new
  # build-relevant files are never accidentally excluded from CI.
  #
  # Safe because `main` has no required status checks — a skipped workflow
  # reports nothing and blocks nothing. If branch protection with required
  # checks is added later, switch to per-job gating (e.g. dorny/paths-filter)
  # so the required checks still report a (neutral/success) result.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.serena/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.serena/**'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.config }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Submodules fetched separately (not via actions/checkout) so the fetch
      # can be retried against a transient submodule-host outage — 2026-08-31
      # CI #741 died here: aomedia.googlesource.com (vendor/libaom) returned
      # HTTP 503 mid-checkout, failing the TSan + MSVC-Debug jobs with "git
      # exited 128". See .github/actions/checkout-submodules.
      - name: Checkout submodules (retried)
        uses: ./.github/actions/checkout-submodules

      # -----------------------------------------------------------------------
      # System packages + premake5 + vendored SDL3 (shared composite actions)
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        uses: ./.github/actions/setup-apt-deps
        with:
          cache-key-suffix: matrix
          extra-packages: gcc-14 clang

      - name: Setup premake5 + vendored SDL3
        uses: ./.github/actions/setup-premake-sdl3

      # -----------------------------------------------------------------------
      # Generate + compile
      # -----------------------------------------------------------------------
      - name: Use gcc-14 as default gcc
        if: matrix.compiler == 'gcc'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      # -----------------------------------------------------------------------
      # Vendored image codecs (libwebp + HEIC/AVIF stack) + FFmpeg -> vendor/codecs-prefix.
      # Keyed on the submodule set (.gitmodules) AND scripts/build_codecs.sh,
      # so a change to the codec/FFmpeg configure flags (e.g. enabling audio
      # decoders) busts the cache and forces a rebuild — build_codecs skips
      # when the lib already exists. Phase 101: build_codecs.bat and
      # build_ffmpeg_windows.sh are gone, so only build_codecs.sh is hashed.
      # Cache key bumped to v6 because the build-script set shrank.
      # -----------------------------------------------------------------------
      - name: Cache vendored codecs build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs
        with:
          path: vendor/codecs-prefix
          key: codecs-v6-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build vendored codecs
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh

      - name: Generate Ninja build files (${{ matrix.compiler }})
        run: bin/premake5 ninja --cc=${{ matrix.compiler }}

      - name: Build (${{ matrix.config }})
        run: ninja ${{ matrix.config }}_x64

      # -----------------------------------------------------------------------
      # Tests — crypto known-answer vectors + round-trip/tamper (Phase 1+).
      # The build step above already compiles the osv_tests target.
      # -----------------------------------------------------------------------
      - name: Run tests (${{ matrix.config }})
        run: ./build/bin/${{ matrix.config }}/osv_tests

      # -----------------------------------------------------------------------
      # Upload artefact (Debug binary only, to keep storage low)
      # -----------------------------------------------------------------------
      - name: Upload build artefact
        if: matrix.config == 'Debug' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-linux-debug
          path: build/bin/Debug/osv
          retention-days: 7

      # -----------------------------------------------------------------------
      # Packaging (Release leg only) — tar.gz with install.sh
      # -----------------------------------------------------------------------
      - name: Package (tar.gz)
        if: matrix.config == 'Release' && matrix.compiler == 'gcc'
        run: scripts/package.sh

      - name: Upload package
        if: matrix.config == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-linux-tarball
          path: dist/*.tar.gz
          retention-days: 7

  # ===========================================================================
  # No-FFmpeg gate — builds and tests with OSV_VENDORED_AV undefined.
  #
  # Every other job builds the full vendored codec set, so the `#else` half of
  # every `#ifdef OSV_VENDORED_AV` was never compiled anywhere in CI. That blind
  # spot let `src/ui/gif_playback.cpp` sit un-compilable in this configuration
  # from Phase 47 until Phase 57 found it by hand: the file opened `namespace ui`
  # INSIDE the #ifdef, so its #else stub was declared outside the namespace.
  # Two more test files were broken the same way when this job was added.
  #
  # `--no-av` makes premake ignore the FFmpeg prefix rather than deleting it, so
  # this job reuses the shared codecs cache untouched (~minutes, not the ~30 the
  # FFmpeg build costs). It also gives CI its only proof of the Phase 57 claim
  # that animated WebP plays without FFmpeg — libwebp is a hard dependency, so
  # those tests run here while every GIF animation test compiles out.
  # ===========================================================================
  tests-no-av:
    name: No FFmpeg / tests / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Submodules fetched separately (not via actions/checkout) so the fetch
      # can be retried against a transient submodule-host outage — 2026-08-31
      # CI #741 died here: aomedia.googlesource.com (vendor/libaom) returned
      # HTTP 503 mid-checkout, failing the TSan + MSVC-Debug jobs with "git
      # exited 128". See .github/actions/checkout-submodules.
      - name: Checkout submodules (retried)
        uses: ./.github/actions/checkout-submodules

      - name: Install build dependencies
        uses: ./.github/actions/setup-apt-deps
        with:
          cache-key-suffix: no-av

      - name: Use gcc-14 as default gcc
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Setup premake5 + vendored SDL3
        uses: ./.github/actions/setup-premake-sdl3

      # The image codecs are NOT optional — libwebp/libheif are hard
      # dependencies, and libwebp is what makes animated WebP work here. Only
      # FFmpeg is dropped, and only by --no-av below; the cache is shared with
      # every other job and read as-is.
      - name: Cache vendored codecs build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs
        with:
          path: vendor/codecs-prefix
          key: codecs-v6-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build vendored codecs
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh

      - name: Generate Ninja build files (--no-av)
        run: bin/premake5 --no-av ninja --cc=gcc

      # Builds the app too, not just the tests: `osv` compiles ~25 src/ui/*.cpp
      # files that the osv_tests target does not list, and this configuration is
      # exactly where an unguarded #ifdef in one of them would hide.
      - name: Build osv + osv_tests (no FFmpeg)
        run: ninja Debug_x64

      - name: Run tests (no FFmpeg)
        env:
          # gfx tests use SDL's software renderer; force a headless video driver
          # so SDL never tries to open a display on the CI runner.
          SDL_VIDEODRIVER: dummy
        run: ./build/bin/Debug/osv_tests

  # ===========================================================================
  # Sanitiser gate — builds and runs the full test suite under ASAN + UBSan +
  # LSan. Enforces the Phase 1 acceptance criterion ("no leaks; mlock handled
  # gracefully") on every PR. As of Phase 4 the osv_tests target links the
  # headless-testable gfx units, so this job provisions the vendored SDL3 build
  # (shared cache with the build-and-test job).
  # ===========================================================================
  tests-asan:
    name: ASAN+UBSan / tests / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Submodules fetched separately (not via actions/checkout) so the fetch
      # can be retried against a transient submodule-host outage — 2026-08-31
      # CI #741 died here: aomedia.googlesource.com (vendor/libaom) returned
      # HTTP 503 mid-checkout, failing the TSan + MSVC-Debug jobs with "git
      # exited 128". See .github/actions/checkout-submodules.
      - name: Checkout submodules (retried)
        uses: ./.github/actions/checkout-submodules

      - name: Install build dependencies
        uses: ./.github/actions/setup-apt-deps
        with:
          cache-key-suffix: asan

      - name: Use gcc-14 as default gcc
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Setup premake5 + vendored SDL3
        uses: ./.github/actions/setup-premake-sdl3

      # Build the decoders too: running libwebp/libheif/libaom under ASAN+UBSan on
      # untrusted input is the highest-value place to have the sanitisers.
      - name: Cache vendored codecs build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs
        with:
          path: vendor/codecs-prefix
          key: codecs-v6-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build vendored codecs
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh

      - name: Generate Ninja build files (--asan)
        run: bin/premake5 --asan ninja --cc=gcc

      - name: Build osv_tests (ASAN)
        run: ninja osv_tests_Debug_x64

      - name: Run tests under ASAN + UBSan + LSan
        env:
          # gfx tests use SDL's software renderer; force a headless video driver
          # so SDL never tries to open a display on the CI runner.
          SDL_VIDEODRIVER: dummy
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Sanitizer builds land in suffixed directories (see premake5.lua) so
        # they can never clobber the plain binaries.
        run: ./build/bin/Debug-asan/osv_tests

  # ===========================================================================
  # ThreadSanitizer gate — builds and runs the full test suite under TSan.
  # Phase 42: catches data races in media::VideoDecodeWorker (Phase 41) and
  # any future concurrent code. Unlike the ASAN leg above, this job does NOT
  # rebuild the vendored codecs/SDL3 under TSan instrumentation — it links
  # the same plain vendor/codecs-prefix / vendor/SDL3/build every other job
  # already builds and caches. TSan's job here is catching races in our own
  # threading code (worker queues, mutexes, atomics), which lives entirely in
  # src/ and tests/; it does not need the codec libraries' own internals
  # instrumented, unlike ASAN's untrusted-input-parsing concern above.
  # ===========================================================================
  tests-tsan:
    name: ThreadSanitizer / tests / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Submodules fetched separately (not via actions/checkout) so the fetch
      # can be retried against a transient submodule-host outage — 2026-08-31
      # CI #741 died here: aomedia.googlesource.com (vendor/libaom) returned
      # HTTP 503 mid-checkout, failing the TSan + MSVC-Debug jobs with "git
      # exited 128". See .github/actions/checkout-submodules.
      - name: Checkout submodules (retried)
        uses: ./.github/actions/checkout-submodules

      - name: Install build dependencies
        uses: ./.github/actions/setup-apt-deps
        with:
          cache-key-suffix: tsan

      - name: Use gcc-14 as default gcc
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Setup premake5 + vendored SDL3
        uses: ./.github/actions/setup-premake-sdl3

      # Reuses the same plain (non-instrumented) codec build every other job
      # builds and caches under this key — see the job-level comment above for
      # why this job does not need its own TSan-instrumented codec prefix.
      - name: Cache vendored codecs build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs
        with:
          path: vendor/codecs-prefix
          key: codecs-v6-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build vendored codecs
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh

      - name: Generate Ninja build files (--tsan)
        run: bin/premake5 --tsan ninja --cc=gcc

      - name: Build osv_tests (TSan)
        run: ninja osv_tests_Debug_x64

      - name: Run tests under ThreadSanitizer
        env:
          # gfx tests use SDL's software renderer; force a headless video driver
          # so SDL never tries to open a display on the CI runner.
          SDL_VIDEODRIVER: dummy
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          LIBVA_DRIVER_NAME: null
          LIBVA_DRIVERS_PATH: /nonexistent
        run: ./build/bin/Debug-tsan/osv_tests

  # ===========================================================================
  # ASAN+UBSan codecs — fuzz test + ASAN-instrumented codec builds.
  # Triggered only on workflow_dispatch (manual) or weekly schedule, not per-PR.
  # Tests the deterministic codec fuzz suite (test_fuzz_codecs.cpp) with
  # ASAN-instrumented WebP/HEIC/AVIF/video decoders to catch memory errors in
  # vendored codec parsers on malformed input.
  # ===========================================================================
  tests-asan-codecs:
    name: ASAN+UBSan / tests-asan-codecs / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only run on manual workflow_dispatch or weekly schedule, not per-PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Submodules fetched separately (not via actions/checkout) so the fetch
      # can be retried against a transient submodule-host outage — 2026-08-31
      # CI #741 died here: aomedia.googlesource.com (vendor/libaom) returned
      # HTTP 503 mid-checkout, failing the TSan + MSVC-Debug jobs with "git
      # exited 128". See .github/actions/checkout-submodules.
      - name: Checkout submodules (retried)
        uses: ./.github/actions/checkout-submodules

      - name: Install build dependencies
        uses: ./.github/actions/setup-apt-deps
        with:
          cache-key-suffix: asan-codecs

      - name: Use gcc-14 as default gcc
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Setup premake5 + vendored SDL3
        uses: ./.github/actions/setup-premake-sdl3

      # Build ASAN-instrumented codecs with a separate cache key (-asan suffix).
      - name: Cache ASAN vendored codecs build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs-asan
        with:
          path: vendor/codecs-prefix-asan
          key: codecs-asan-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build ASAN-instrumented vendored codecs
        if: steps.cache-codecs-asan.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh --asan

      - name: Generate Ninja build files (--asan)
        run: bin/premake5 --asan ninja --cc=gcc

      - name: Build osv_tests (ASAN + instrumented codecs)
        run: ninja osv_tests_Debug_x64

      - name: Run codec fuzz tests under ASAN + UBSan + LSan
        env:
          # gfx tests use SDL's software renderer; force a headless video driver
          # so SDL never tries to open a display on the CI runner.
          SDL_VIDEODRIVER: dummy
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/bin/Debug-asan/osv_tests

  # ===========================================================================
  # SonarQube analysis — static analysis of src/ via the compilation database
  # (compile_commands.json) emitted by the real Ninja build of the osv target.
  #
  # Requires one repository secret; without SONAR_TOKEN every step is skipped
  # so the job stays green until analysis is configured:
  #   SONAR_TOKEN  - project analysis token (Settings → Secrets → Actions)
  # The host URL is hardcoded to https://sonarcloud.io in sonar-project.properties.
  # ===========================================================================
  sonarqube:
    name: SonarQube analysis / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Skip notice (no SONAR_TOKEN configured)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set — skipping SonarQube analysis."
          echo "Add the SONAR_TOKEN repository secret to enable it."

      # Full history so Sonar can attribute new-code and blame accurately.
      - name: Checkout (full history)
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules (retried)
        if: env.SONAR_TOKEN != ''
        uses: ./.github/actions/checkout-submodules

      - name: Cache apt packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-cache
          key: apt-sonar-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-sonar-

      - name: Install build dependencies
        if: env.SONAR_TOKEN != ''
        run: |
          # CI's apt mirror occasionally hangs the connection indefinitely; bound
          # each fetch (30s) and retry so a stuck mirror fails fast instead of
          # hanging the whole job. Backed by the job-level timeout-minutes too.
          # Cache the downloaded .debs in /tmp/apt-cache (Dir::Cache::archives +
          # Keep-Downloaded-Packages) so repeat runs skip the slow apt download.
          # 1777 lets apt's _apt sandbox user write into the restored cache dir.
          sudo mkdir -p /tmp/apt-cache/partial
          sudo chmod -R 1777 /tmp/apt-cache
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDir::Cache::archives "/tmp/apt-cache";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-osv-ci-timeout >/dev/null
          # The runner image ships Microsoft/Azure apt repos we don't use; they
          # intermittently 403, which fails `apt-get update` (exit 100) and kills
          # the whole step. Drop them first — none of our build deps come from them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            nasm \
            g++-14 \
            unzip \
            curl \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libasound2-dev \
            libpulse-dev
          # apt re-creates partial/ and lock owned by the _apt user (mode 700/640)
          # during install; make the cache dir readable so the (non-root) runner
          # can tar it in the post-save step (otherwise the save fails silently).
          sudo chmod -R a+rX /tmp/apt-cache

      - name: Cache premake5 binary
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-premake5
        with:
          path: bin/premake5
          key: premake5-5.0.0-beta8-linux

      - name: Download premake5
        if: env.SONAR_TOKEN != '' && steps.cache-premake5.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSL \
            "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz" \
            -o /tmp/premake5.tar.gz
          tar -xzf /tmp/premake5.tar.gz -C bin/
          chmod +x bin/premake5

      - name: Cache vendored SDL3 build
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-sdl3
        with:
          path: vendor/SDL3/build
          key: sdl3-linux-${{ hashFiles('.gitmodules') }}-${{ runner.arch }}

      - name: Build vendored SDL3
        if: env.SONAR_TOKEN != '' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/SDL3 -B vendor/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON            \
            -DSDL_SHARED=OFF           \
            -DSDL_TESTS=OFF            \
            -DSDL_EXAMPLES=OFF         \
            -DSDL_INSTALL_TESTS=OFF    \
            -DSDL_X11_XTEST=OFF        \
            -DSDL_JOYSTICK=OFF         \
            -DSDL_HAPTIC=OFF           \
            -DSDL_SENSOR=OFF           \
            -DSDL_CAMERA=OFF           \
            -G "Ninja"
          cmake --build vendor/SDL3/build --parallel "$(nproc)"

      - name: Use gcc-14 as default gcc
        if: env.SONAR_TOKEN != ''
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      # osv links the image codecs, so the analysed compile below needs them.
      - name: Cache vendored codecs build
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-codecs
        with:
          path: vendor/codecs-prefix
          key: codecs-v6-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build_codecs.sh') }}-${{ runner.arch }}

      - name: Build vendored codecs
        if: env.SONAR_TOKEN != '' && steps.cache-codecs.outputs.cache-hit != 'true'
        run: scripts/build_codecs.sh

      - name: Generate Ninja build files (gcc, with coverage)
        if: env.SONAR_TOKEN != ''
        run: bin/premake5 --coverage ninja --cc=gcc

      # Build the full osv target and emit the compilation database consumed by
      # Sonar's CFamily analyzer (sonar.cfamily.compile-commands) — same command
      # scripts/gen.sh uses for clangd. Replaces the deprecated build-wrapper,
      # whose downloaded binary drifted out of sync with the analyzer version.
      # Coverage flags are baked into the build, so .gcno files are emitted.
      - name: Build + write compile_commands.json
        if: env.SONAR_TOKEN != ''
        run: |
          ninja Debug_x64
          ninja -t compdb > compile_commands.json

      # Running the tests produces .gcda files alongside the .gcno files.
      - name: Run tests (generates .gcda coverage data)
        if: env.SONAR_TOKEN != ''
        run: ./build/bin/Debug/osv_tests

      # Convert .gcda/.gcno pairs into .gcov files that SonarCFamily can read.
      # --preserve-paths keeps path info so Sonar maps lines back to sources.
      - name: Collect gcov coverage reports
        if: env.SONAR_TOKEN != ''
        run: |
          find build/obj/Debug/osv_tests -name '*.gcda' \
            | xargs gcov --preserve-paths 2>/dev/null || true

      # GITHUB_TOKEN lets SonarCloud post inline PR comments and status checks.
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Linting — clang-format on changed lines only. Non-blocking.
  #
  # clang-tidy was REMOVED here. With a real compile_commands.json it analyses
  # ~170 TUs and needs ~29 minutes even at one process per core — it blew the
  # job timeout without finishing. Before that it had no compilation database at
  # all, so it silently analysed nothing and reported the project's own headers
  # as "file not found". Its real output is ~4377 findings, ~3000 of them from
  # four checks this codebase deliberately rejects (brace style, literal-suffix
  # case, easily-swappable-parameters, implicit-bool-conversion). Run it locally
  # instead: scripts/gen.sh writes compile_commands.json for exactly this.
  # ===========================================================================
  lint:
    name: Lint / clang-format / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    continue-on-error: true

    # Single place to bump the formatter. Changing this changes what the check
    # considers correctly formatted, so it is a deliberate edit, not a drift.
    env:
      CLANG_FORMAT_MAJOR: "18"

    steps:
      # fetch-depth: 0 is LOAD-BEARING. The step below diffs against the PR base
      # commit, which a shallow clone does not contain. At the default depth of 1
      # this failed instantly with "<sha> is not a commit" and `|| true` swallowed
      # it, so the step never checked a single line on any PR. No submodules: only
      # first-party src/ and tests/ are formatted, and skipping them drops the
      # large vendored checkouts.
      - name: Checkout (full history — needed for the merge-base diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PINNED. `apt-get install clang-format` follows the runner image's default
      # (18.1.3 today, whatever GitHub ships tomorrow), and clang-format's output
      # changes between major versions — an unpinned formatter silently redefines
      # what "correctly formatted" means, and the check would start flagging code
      # that was clean yesterday. clang-format-18 is the versioned package; the
      # git-clang-format wrapper is a version-agnostic differ, so it is pointed at
      # the pinned binary via --binary rather than being pinned itself.
      - name: Install clang-format ${{ env.CLANG_FORMAT_MAJOR }} (pinned)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-osv-ci-timeout >/dev/null
          sudo apt-get update -qq
          # clang-format-N provides the pinned binary; clang-format provides the
          # git-clang-format wrapper script (never invoked as a formatter itself).
          sudo apt-get install -y --no-install-recommends \
            "clang-format-${CLANG_FORMAT_MAJOR}" clang-format
          # Assert the pin held. Drift must fail loudly here, not silently change
          # the diff three months from now.
          got="$(clang-format-${CLANG_FORMAT_MAJOR} --version)"
          echo "pinned binary: $got"
          case "$got" in
            *"clang-format version ${CLANG_FORMAT_MAJOR}."*) ;;
            *) echo "::error::expected clang-format ${CLANG_FORMAT_MAJOR}.x, got: $got"
               exit 1 ;;
          esac

      - name: clang-format --diff (changed lines only)
        run: |
          # Enforce style on new/changed code only — the existing tree has
          # hand-aligned struct members clang-format cannot reproduce (see the
          # header of .clang-format).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          # Verify the base is actually present before diffing against it. This is
          # the check whose absence hid the bug above: without it a missing commit
          # looks identical to a clean diff.
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base commit $BASE is not present in the clone — checkout needs fetch-depth: 0"
            exit 1
          fi
          # git clang-format --diff exits 1 when changed lines would be
          # reformatted and 0 when they are clean, so the two cases MUST be told
          # apart. The old blanket `|| true` collapsed them together with genuine
          # errors, which is how the "not a commit" failure above stayed hidden.
          # Formatting differences stay advisory (this repo formats new/changed
          # code only); anything else is a real failure and is surfaced.
          set +e
          diff_out=$(git clang-format --binary "clang-format-${CLANG_FORMAT_MAJOR}" \
                       --diff "$BASE" -- src/ tests/ 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$diff_out"
          case "$rc" in
            0) echo "clang-format: changed lines are clean" ;;
            1) echo "::warning::clang-format would reformat changed lines (advisory — diff above)" ;;
            *) echo "::error::git clang-format failed with exit $rc (not a formatting difference)"
               exit "$rc" ;;
          esac
